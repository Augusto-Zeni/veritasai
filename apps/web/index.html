<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Verificação automatizada de notícias em português, com afirmações, evidências e fontes."
    />
    <meta name="theme-color" content="#fafbfd" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>VeritasAI — verificação de notícias</title>
    <script>
      // Aplica o tema antes da primeira pintura (evita piscar). Ver src/lib/theme.tsx.
      ;(function () {
        var pref = 'system'
        try {
          pref = localStorage.getItem('veritasai-tema') || 'system'
        } catch (e) {}
        var dark =
          pref === 'dark' ||
          (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) {
          document.documentElement.classList.add('dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#16181f')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
